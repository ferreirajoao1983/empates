<style>
  body{background:#0D1512;color:#EDEFEA;font-family:system-ui,sans-serif;padding:20px;max-width:700px;margin:0 auto}
  button{background:#1C2A21;border:1px solid #2A3A2F;color:#EDEFEA;border-radius:6px;padding:10px 14px;font-size:13px;margin:4px 4px 4px 0;cursor:pointer}
  .log{background:#1C2A21;border:1px solid #2A3A2F;border-radius:8px;padding:10px;font-family:monospace;font-size:10px;white-space:pre-wrap;margin-top:10px;max-height:600px;overflow-y:auto;word-break:break-all}
  .ok{color:#8FD9AC} .fail{color:#E08F8F} .hdr{color:#C9A24B;font-weight:bold}
</style>
<h2 style="font-size:16px">TRX — Testar página club-profile</h2>
<button id="run">Testar perfil de equipa</button>
<div class="log" id="log">Pronto.</div>
<script>
const logEl = document.getElementById('log');
function log(msg, cls){ const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
const PROXIES = [
  (t)=>'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(t),
  (t)=>'https://corsproxy.io/?url=' + encodeURIComponent(t),
  (t)=>'https://api.allorigins.win/raw?url=' + encodeURIComponent(t),
];
async function fetchComFallback(targetUrl, timeoutMs){
  for(const proxyFn of PROXIES){
    const url = proxyFn(targetUrl);
    log('A tentar: ' + url);
    try{
      const fetchPromise = fetch(url);
      const timeoutPromise = new Promise((_, reject)=> setTimeout(()=>reject(new Error('tempo esgotado')), timeoutMs));
      const resp = await Promise.race([fetchPromise, timeoutPromise]);
      if(!resp.ok){ log('status ' + resp.status); continue; }
      const text = await resp.text();
      if(text.length < 500){ log('resposta pequena demais'); continue; }
      log('Sucesso: ' + text.length + ' caracteres', 'ok');
      return text;
    }catch(err){ log('falhou: ' + err.message); }
  }
  throw new Error('Todos os proxies falharam.');
}

document.getElementById('run').onclick = async ()=>{
  logEl.innerHTML = '';
  try{
    // Ararat-Armenia, team_id=3683 (visto no diagnóstico anterior)
    const html = await fetchComFallback('https://www.vitibet.com/index.php?clanek=club-profile&team_id=3683&lang=pt&team_name=ararat-armenia', 15000);
    const doc = new DOMParser().parseFromString(html, 'text/html');

    log('\\n--- Tabelas encontradas ---', 'hdr');
    const tables = doc.querySelectorAll('table');
    log('Total: ' + tables.length);
    tables.forEach((t,i)=> log('Tabela ' + i + ': ' + t.querySelectorAll('tr').length + ' linhas, class=' + t.className));

    log('\\n--- Procura por termos relevantes ---', 'hdr');
    const bodyText = doc.body ? doc.body.innerText : '';
    ['últimos jogos','resultados','histórico','matches','fixtures','resultado'].forEach(termo=>{
      const idx = bodyText.toLowerCase().indexOf(termo.toLowerCase());
      if(idx>=0) log('"' + termo + '": ' + bodyText.slice(Math.max(0,idx-50), idx+200).replace(/\s+/g,' '));
    });

    if(tables.length){
      let maior = tables[0];
      tables.forEach(t=>{ if(t.querySelectorAll('tr').length > maior.querySelectorAll('tr').length) maior = t; });
      log('\\n--- Tabela maior, primeiras 4 linhas ---', 'hdr');
      const trs = maior.querySelectorAll('tr');
      for(let i=0;i<4 && i<trs.length;i++) log('[' + i + '] ' + trs[i].outerHTML.slice(0,800));
    }

    log('\\n--- Tabela 0 (stats-table, primeiras 6 linhas) ---', 'hdr');
    const t0rows = tables[0].querySelectorAll('tr');
    for(let i=0;i<6 && i<t0rows.length;i++) log('[' + i + '] ' + t0rows[i].outerHTML.slice(0,600));

    log('\\n--- Tabela 1 (stats-table, todas as linhas) ---', 'hdr');
    const t1rows = tables[1].querySelectorAll('tr');
    for(let i=0;i<t1rows.length;i++) log('[' + i + '] ' + t1rows[i].outerHTML.slice(0,600));
  }catch(err){ log('ERRO: ' + err.message, 'fail'); }
};
</script>

<style>
  body{background:#0D1512;color:#EDEFEA;font-family:system-ui,sans-serif;padding:20px;max-width:700px;margin:0 auto}
  button{background:#1C2A21;border:1px solid #2A3A2F;color:#EDEFEA;border-radius:6px;padding:10px 14px;font-size:13px;margin:4px 4px 4px 0;cursor:pointer}
  .log{background:#1C2A21;border:1px solid #2A3A2F;border-radius:8px;padding:10px;font-family:monospace;font-size:10px;white-space:pre-wrap;margin-top:10px;max-height:600px;overflow-y:auto;word-break:break-all}
  .ok{color:#8FD9AC} .fail{color:#E08F8F} .hdr{color:#C9A24B;font-weight:bold}
</style>
<h2 style="font-size:16px">TRX — Testar página match-detail do Vitibet</h2>
<button id="run">Analisar match-detail</button>
<div class="log" id="log">Pronto.</div>
<script>
const logEl = document.getElementById('log');
function log(msg, cls){ const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
const PROXIES = [
  (t)=>'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(t),
  (t)=>'https://corsproxy.io/?url=' + encodeURIComponent(t),
  (t)=>'https://api.allorigins.win/raw?url=' + encodeURIComponent(t),
];
async function fetchComFallback(targetUrl, timeoutMs){
  for(const proxyFn of PROXIES){
    const url = proxyFn(targetUrl);
    log('A tentar: ' + url);
    try{
      const fetchPromise = fetch(url);
      const timeoutPromise = new Promise((_, reject)=> setTimeout(()=>reject(new Error('tempo esgotado')), timeoutMs));
      const resp = await Promise.race([fetchPromise, timeoutPromise]);
      if(!resp.ok){ log('status ' + resp.status); continue; }
      const text = await resp.text();
      if(text.length < 500){ log('resposta pequena demais'); continue; }
      log('Sucesso: ' + text.length + ' caracteres', 'ok');
      return text;
    }catch(err){ log('falhou: ' + err.message); }
  }
  throw new Error('Todos os proxies falharam.');
}

document.getElementById('run').onclick = async ()=>{
  logEl.innerHTML = '';
  try{
    // primeiro busca a página principal para encontrar um fixture_id real e testar
    const html = await fetchComFallback('https://www.vitibet.com/index.php?clanek=quicktips&sekce=fotbal&lang=pt&design_version=old', 15000);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const link = doc.querySelector('a[href*="match-detail"]');
    if(!link){ log('Não encontrei nenhum link de match-detail.', 'fail'); return; }
    const href = link.getAttribute('href');
    log('Link de exemplo encontrado: ' + href, 'ok');
    const fullUrl = 'https://www.vitibet.com/' + href.replace(/^\.?\//,'');
    log('URL completo a testar: ' + fullUrl);

    const detailHtml = await fetchComFallback(fullUrl, 15000);
    const detailDoc = new DOMParser().parseFromString(detailHtml, 'text/html');

    log('\\n--- Texto visível (primeiros 1500 caracteres) ---', 'hdr');
    log((detailDoc.body?detailDoc.body.innerText.trim():'').slice(0,1500));

    log('\\n--- Tabelas na página de detalhe ---', 'hdr');
    const tables = detailDoc.querySelectorAll('table');
    log('Tabelas encontradas: ' + tables.length);
    tables.forEach((t,i)=>{
      log('\\n[Tabela ' + i + ', ' + t.querySelectorAll('tr').length + ' linhas]', 'hdr');
      log(t.outerHTML.slice(0,2500));
    });

    log('\\n--- Procura por "H2H" ou "confronto" no texto ---', 'hdr');
    const bodyText = detailDoc.body ? detailDoc.body.innerText : '';
    ['H2H','head to head','confronto','directo','posição','position','tabela'].forEach(termo=>{
      const idx = bodyText.toLowerCase().indexOf(termo.toLowerCase());
      if(idx>=0) log('"' + termo + '" encontrado, contexto: ' + bodyText.slice(Math.max(0,idx-50), idx+150).replace(/\s+/g,' '));
    });

  }catch(err){ log('ERRO: ' + err.message, 'fail'); }
};
</script>
